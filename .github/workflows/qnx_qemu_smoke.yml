name: QNX QEMU Smoke Test (aarch64)

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  qnx-smoke-aarch64:
    name: Build & Test Hello World on QNX AArch64 QEMU
    uses: eclipse-score/cicd-workflows/.github/workflows/qnx-build.yml@d2083d5dac0e309643d9f495e61342dfbaf07ed5
    permissions:
      contents: read
      pull-requests: read
    with:
      bazel-config: "qnx-aarch64"
      bazel-target: "//examples/basic:hello"
      bazel-test-target: "//examples/basic:basic_test"
      working-directory: "."
      extra-bazel-test-flags: "--test_output=all --test_timeout=120,600,1800,7200"
    secrets:
      score-qnx-license: ${{ secrets.SCORE_QNX_LICENSE }}
      score-qnx-user: ${{ secrets.SCORE_QNX_USER }}
      score-qnx-password: ${{ secrets.SCORE_QNX_PASSWORD }}
